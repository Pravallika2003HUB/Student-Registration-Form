<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form action="">
        <label for="rn"> Rollno:</label>
        <input id="rn" type="number" name="rollno" placeholder="roll number"> 
        <br><br>
        <label for="sn">Student Name:</label>
        <input required id="sn" type="text" name="studentname" placeholder="student name"> <br>
        <label for="fn">Father's Name:</label>
        <input id="fn" type="text" name="fathername" placeholder="father's name"> <br>
        Date of birth:
        <input type="date"><br>
        Mobile number:
        <input type="tel"><br>
        Email id:
        <input type="email"><br>
        Password:
        <input type="password"><br>
    </form>
    <form action="">
        choose your Gender <br>
        <input id="py" type = "radio" name="gender" value="male">
        <label for="py">Male</label> <br>
        <input id="js" type = "radio" name="gender" value="female">
        <label for="js">Female</label> <br>
        choose your Department <br>
        <input type="checkbox" name="department" value="cse">
        <label for="cse">CSE</label>
        <input type="checkbox" name="department" value="it">
        <label for="it">IT</label>
        <input type="checkbox" name="department" value="ece">
        <label for="ece">ECE</label>
        <input type="checkbox" name="department" value="eee">
        <label for="eee">EEE</label> 
        <input type="checkbox" name="department" value="mech">
        <label for="mech">MECH</label> 
        <br>
        Course:
        <select name="course" id="">
            <option value="btech">B.Tech</option>
            <option value="mtech">M.Tech</option>
            <option value="mba">MBA</option>
            <option value="msc">M.Sc</option>
        </select>
        <br>
        Sudent Photo:
        <input type="file"><br>

        City:
        <input type="text"><br>
         
        Address:
        <input type="text"><br>
        <button type="register">register</button>
    </form>
</body>
</html>
